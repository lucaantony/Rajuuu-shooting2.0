<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shoot the Pink Ride</title>
<style>
:root{--bg:#1b0f2e;--ink:#fff4e0;--hot:#ff3d8b;--gold:#ffc93c;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Trebuchet MS","Arial Black",sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;font-size:20px;font-weight:900;pointer-events:none;text-shadow:0 2px 0 #000}
#fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#fail div{background:#e01e37;color:#fff;font:900 clamp(34px,10vw,84px)/1 "Arial Black",sans-serif;padding:.3em .5em;border:6px solid #fff;border-radius:14px;transform:rotate(-6deg);text-align:center;box-shadow:0 10px 0 #000}
#fail small{display:block;font-size:.4em;margin-top:.4em;letter-spacing:.04em}
#fail.show{display:flex;animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(27,15,46,.93);text-align:center;padding:24px}
#menu h1{margin:0;font:900 clamp(34px,9vw,72px)/1 "Arial Black",sans-serif;color:var(--hot);text-shadow:0 4px 0 #000}
#menu p{margin:0;max-width:420px;font-size:18px;line-height:1.4}
#menu button{font:900 24px "Arial Black",sans-serif;background:var(--gold);color:#2a1300;border:0;border-radius:12px;padding:14px 34px;box-shadow:0 6px 0 #a36b00;cursor:pointer}
#menu button:active{transform:translateY(4px);box-shadow:0 2px 0 #a36b00}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">Score 0</span><span id="best">Best 0</span><span id="lv">&#10084;&#10084;&#10084;</span></div>
<div id="fail"><div>FAILED<small>- Raju</small></div></div>
<div id="menu"><h1 id="mt">Shoot the Pink Ride</h1><p id="mp">He keeps driving around the screen. Tap or click to shoot him. Miss and Raju tells you that you failed. Three misses and it's over.</p><button id="go">Start</button></div>

function tone(f0,f1,d,type,vol,when=0){const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+when;o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)}
function noise(d,vol){const a=ac(),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=vol;s.connect(g).connect(a.destination);s.start()}

 miss(){tone(300,90,.35,'sawtooth',.3);tone(220,60,.45,'sawtooth',.3,.3)},
 over(){[400,330,260,180].forEach((f,i)=>tone(f,f*.8,.3,'triangle',.3,i*.25))}};
let sprite,best=0;try{best=+(localStorage.getItem('rajuBest')||0)}catch(e){}
const T={x:200,y:200,vx:3,vy:2,w:200,h:180,ang:0,dead:0};
let score=0,lives=3,run=false,parts=[],flash=0,mx=-99,my=-99,failT;
const $=id=>document.getElementById(id);
function hud(){$('sc').textContent='Score '+score;$('best').textContent='Best '+best;$('lv').textContent='\u2764'.repeat(Math.max(lives,0))}
function size(){T.w=Math.min(W*.42,230);T.h=T.w*(pic.naturalHeight/pic.naturalWidth||.9)}
function respawn(){size();const s=3+Math.min(score,15)*.45,a=Math.random()*6.28;T.x=Math.random()*(W-T.w);T.y=60+Math.random()*(H-T.h-80);T.vx=Math.cos(a)*s;T.vy=Math.sin(a)*s;if(Math.abs(T.vx)<1.5)T.vx=1.5;T.dead=0}
function start(){score=0;lives=3;run=true;$('menu').style.display='none';respawn();hud();ac();loadHit()}
$('go').onclick=start;
function hitTest(px,py){const lx=px-T.x,ly=py-T.y;if(lx<0||ly<0||lx>T.w||ly>T.h)return false;
 if(!sprite){sprite=document.createElement('canvas');sprite.width=pic.naturalWidth;sprite.height=pic.naturalHeight;sprite.getContext('2d').drawImage(pic,0,0)}
 const sx=lx/T.w*sprite.width,sy=ly/T.h*sprite.height;return sprite.getContext('2d').getImageData(sx|0,sy|0,1,1).data[3]>40}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:col})}}
function shoot(e){if(!run)return;const r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e,x=p.clientX-r.left,y=p.clientY-r.top;mx=x;my=y;sfx.shot();flash=1;
 if(hitTest(x,y)){playHit();score++;if(score>best){best=score;try{localStorage.setItem('rajuBest',best)}catch(e){}}burst(x,y,'#ffc93c',26);burst(x,y,'#ff3d8b',18);respawn();hud()}
 else{sfx.miss();lives--;hud();const f=$('fail');f.classList.remove('show');void f.offsetWidth;f.classList.add('show');clearTimeout(failT);failT=setTimeout(()=>f.classList.remove('show'),900);burst(x,y,'#888',10);
  if(lives<=0){run=false;setTimeout(()=>{sfx.over();$('mt').textContent='Game over - Raju says failed';$('mp').textContent='You scored '+score+'. Best: '+best+'.';$('go').textContent='Play again';$('menu').style.display='flex'},700)}}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();shoot(e)});
cv.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
function loop(){ctx.clearRect(0,0,W,H);
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b1650');g.addColorStop(1,'#12081f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,61,139,.07)';for(let i=0;i<W;i+=48)ctx.fillRect(i,0,2,H);for(let j=0;j<H;j+=48)ctx.fillRect(0,j,W,2);
 if(run||T.w){if(run){T.x+=T.vx;T.y+=T.vy;if(T.x<0||T.x+T.w>W){T.vx*=-1;T.x=Math.max(0,Math.min(W-T.w,T.x))}if(T.y<40||T.y+T.h>H){T.vy*=-1;T.y=Math.max(40,Math.min(H-T.h,T.y))}if(Math.random()<.01){T.vy+=(Math.random()-.5)*3}}
  if(pic.complete){ctx.save();ctx.translate(T.x+T.w/2,T.y+T.h/2);if(T.vx<0)ctx.scale(-1,1);ctx.rotate(Math.sin(performance.now()/180)*.04);ctx.drawImage(pic,-T.w/2,-T.h/2,T.w,T.h);ctx.restore()}}
 parts=parts.filter(p=>(p.l-=.03)>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,4,0,6.28);ctx.fill()});ctx.globalAlpha=1;
 if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash*.25+')';ctx.fillRect(0,0,W,H);flash-=.15}
 if(run&&mx>0){ctx.strokeStyle='#ffc93c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(mx,my,20,0,6.28);ctx.moveTo(mx-30,my);ctx.lineTo(mx+30,my);ctx.moveTo(mx,my-30);ctx.lineTo(mx,my+30);ctx.stroke()}
 requestAnimationFrame(loop)}
pic.onload=()=>{size();T.x=W/3;T.y=H/3};hud();loop();
</script></body></html>
